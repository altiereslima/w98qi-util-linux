name: Build cfdisk
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            libtool \
            gettext \
            pkg-config \
            libncurses5-dev \
            libblkid-dev \
            uuid-dev \
            zlib1g-dev \
            libselinux1-dev \
            libcap-dev \
            libmount-dev \
            libsmartcols-dev

      - name: Build
        run: |
          ./autogen.sh
          ./configure --enable-all-programs --disable-makeinstall-chown --disable-use-tty-group --disable-nls
          make -j$(nproc)
          sudo make install DESTDIR=/tmp/dest

      - name: Upload cfdisk binary
        uses: actions/upload-artifact@v4
        with:
          name: cfdisk-binary
          path: |
            disk-utils/cfdisk
            /tmp/dest/usr/sbin/cfdisk
            /tmp/dest/usr/lib/*.so*
            /tmp/dest/lib/*.so*