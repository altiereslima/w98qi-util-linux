- name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          autoconf \
          automake \
          libtool \
          gettext \
          pkg-config \
          libncurses5-dev \
          libblkid-dev \
          uuid-dev \
          zlib1g-dev \
          libselinux1-dev \
          libcap-dev \
          libmount-dev \
          libsmartcols-dev

    - name: Build and Test
      env:
        COMPILER: gcc
        COMPILER_VERSION: 10
        SANITIZE: yes
        CFLAGS: "-O2 -Wall -fPIC -I$(pwd)/include"
        LDFLAGS: "-L$(pwd)/lib -Wl,--whole-archive -Wl,--start-group -lcommon -lsmartcols -lblkid -luuid -lmount -Wl,--end-group -Wl,--no-whole-archive"
        PKG_CONFIG_PATH: "$(pwd)/lib/pkgconfig"
      run: |
        chmod +x .github/workflows/cibuild.sh
        sudo -E .github/workflows/cibuild.sh CONFIGURE MAKE
- name: Build and Test
      env:
        COMPILER: gcc
        COMPILER_VERSION: 10
        SANITIZE: no
        CFLAGS: "-O2 -Wall -fPIC"
      run: |
        chmod +x .github/workflows/cibuild.sh
        ./autogen.sh
        ./configure --enable-static --enable-all-programs
        make -j$(nproc) disk-utils/cfdisk
        sudo make install DESTDIR=/tmp/dest

    - name: Upload cfdisk binary
      uses: actions/upload-artifact@v4
      with:
        name: cfdisk-binary
        path: |
          disk-utils/cfdisk
          /tmp/dest/usr/local/sbin/cfdisk
          /tmp/dest/usr/local/lib/*.so*