name: Build test
on:
  pull_request:
    paths-ignore:
      - 'Documentation/**'
      - 'lib*/docs/**'
  push:
    branches:
      - 'cibuild'
      - 'master'
      - 'next'
      - 'stable/**'
    paths-ignore:
      - 'Documentation/**'
      - 'lib*/docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      COMPILER: gcc
      COMPILER_VERSION: 10
      SANITIZE: no
      CFLAGS: "-m32 -O1"
      LDFLAGS: "-m32"
    steps:
      - uses: actions/checkout@v1
      - name: Ubuntu setup
        run: sudo -E .github/workflows/cibuild-setup-ubuntu.sh
      - name: Install 32-bit dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 libncursesw5-dev:i386 libtinfo-dev:i386 libpam0g-dev:i386 libpam-modules:i386
      - name: Configure & Make
        run: |
          ./autogen.sh
          ./configure --host=i386-linux-gnu --build=i386-linux-gnu --enable-static --disable-shared --without-python --disable-makeinstall-chown --disable-use-tty-group --disable-strip --disable-login --disable-su --disable-sulogin --disable-nologin --enable-libfdisk --enable-libsmartcols --enable-libuuid --enable-libblkid --enable-libmount
          make V=1 LDFLAGS="-m32 -static" CFLAGS="-m32 -O1" fdisk cfdisk sfdisk
      - name: Make install
        run: sudo make install DESTDIR=/tmp/dest
      - name: Create artifact directory
        run: |
          mkdir -p artifacts
          cp -r /tmp/dest/* artifacts/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: util-linux-binaries
          path: artifacts/