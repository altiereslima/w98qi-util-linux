name: Build test
on:
  pull_request:
    paths-ignore:
      - 'Documentation/**'
      - 'lib*/docs/**'
  push:
    branches:
      - 'cibuild'
      - 'master'
      - 'next'
      - 'stable/**'
    paths-ignore:
      - 'Documentation/**'
      - 'lib*/docs/**'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - { COMPILER: "gcc",   COMPILER_VERSION: "10", SANITIZE: "yes"  }
          - { COMPILER: "gcc",   COMPILER_VERSION: "10", SANITIZE: "no"   }
          - { COMPILER: "clang", COMPILER_VERSION: "15", SANITIZE: "yes"  }
          - { COMPILER: "clang", COMPILER_VERSION: "15", SANITIZE: "no"   }
    env: ${{ matrix.env }}
    steps:
      - name: Repository checkout
        uses: actions/checkout@v1
      - name: Setup build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common curl wget
      - name: Add LLVM repository
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          # Try LLVM 15 first, fallback to 14 if not available
          if curl -s --head --fail http://apt.llvm.org/focal/dists/llvm-toolchain-focal-15/ > /dev/null; then
            sudo apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-15 main"
          else
            sudo apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
          fi
          sudo apt-get update
      - name: Install build dependencies
        run: |
          sudo apt-get install -y build-essential gcc make gcc-10 g++-10 libasan6
      - name: Configure and build
        env:
          CC: gcc-10
          CXX: g++-10
          CFLAGS: "-Wno-error -Wno-unused-variable -Wno-unused-function -fPIC"
        run: |
          ./configure || {
            echo "Configure failed. Check config.log:"
            cat config.log || echo "config.log not found"
            exit 1
          }
          make -j$(nproc) || {
            echo "Make failed"
            exit 1
          }
      - name: Show config.log on failure
        if: failure()
        run: |
          if [ -f config.log ]; then
            cat config.log
          else
            echo "Arquivo config.log não encontrado."
          fi
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcheck-dev  # Substitua por dependências reais dos testes
      - name: Compile tests
        run: make check-programs
      - name: Verify test binaries
        run: |
          if [ ! -f ./tests/run.sh ]; then
            echo "Test binaries não foram gerados!"
            exit 1
          fi
      - name: Verify 'kill' binary
        run: |
          if [ ! -f ./kill ]; then
            echo "Erro: O binário 'kill' não foi gerado."
            exit 1
          fi
      - name: Check
        run: sudo -E .github/workflows/cibuild.sh CHECK
      - name: Make install
        run: .github/workflows/cibuild.sh INSTALL
  coveralls:
    permissions:
      contents: read # to fetch code (actions/checkout)
      checks: write # to create new checks (coverallsapp/github-action)

    runs-on: ubuntu-latest
    if: github.repository == 'util-linux/util-linux'
    env:
      COMPILER: gcc
      COMPILER_VERSION: 10
      SANITIZE: no
      COVERAGE: yes
      CFLAGS: "-Wno-error -Wno-unused-variable -Wno-unused-function"
    steps:
      - name: Repository checkout
        uses: actions/checkout@v1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential sudo wget curl
      - name: Add LLVM repository
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
          if ! curl -s --head --fail http://apt.llvm.org/focal/dists/llvm-toolchain-focal-14/ > /dev/null; then
            echo "O repositório LLVM não está acessível. Verifique a URL ou a versão." >&2
            exit 1
          fi
      - name: Add repository with retry
        run: |
          for i in {1..3}; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
              echo "Repositório adicionado com sucesso."
              break
            fi
            echo "Tentativa $i falhou. Retentando em 5 segundos..."
            sleep 5
          done
      - name: Enable detailed logs
        run: set -x
      - name: Ubuntu setup
        run: sudo -E .github/workflows/cibuild-setup-ubuntu.sh
      - name: Configure & Make
        run: .github/workflows/cibuild.sh CONFIGURE MAKE
      - name: Compile tests
        run: make check-programs
      - name: Verify test binaries
        run: |
          if [ ! -f ./tests/run.sh ]; then
            echo "Test binaries não foram gerados!"
            exit 1
          fi
      - name: Run tests
        run: ./tests/run.sh --show-diff
      - name: Check
        run: sudo -E .github/workflows/cibuild.sh CHECK
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage.info
  meson:
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPILER: gcc
      COMPILER_VERSION: 10
      SANITIZE: no
      CFLAGS: "-Wno-error -Wno-unused-variable -Wno-unused-function"
    steps:
      - name: Repository checkout
        uses: actions/checkout@v1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential sudo wget curl
      - name: Add LLVM repository
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
          if ! curl -s --head --fail http://apt.llvm.org/focal/dists/llvm-toolchain-focal-14/ > /dev/null; then
            echo "O repositório LLVM não está acessível. Verifique a URL ou a versão." >&2
            exit 1
          fi
      - name: Add repository with retry
        run: |
          for i in {1..3}; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
              echo "Repositório adicionado com sucesso."
              break
            fi
            echo "Tentativa $i falhou. Retentando em 5 segundos..."
            sleep 5
          done
      - name: Enable detailed logs
        run: set -x
      - name: Ubuntu setup
        run: sudo -E .github/workflows/cibuild-setup-ubuntu.sh
      - name: Meson configure
        run: .github/workflows/cibuild.sh MESONCONF
      - name: Meson build
        run: .github/workflows/cibuild.sh MESONBUILD
  distcheck:
    needs: build
    runs-on: ubuntu-latest
    env:
      COMPILER: gcc
      COMPILER_VERSION: 10
      SANITIZE: no
      CFLAGS: "-Wno-error -Wno-unused-variable -Wno-unused-function"
    steps:
      - name: Repository checkout
        uses: actions/checkout@v1
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential sudo wget curl
      - name: Add LLVM repository
        run: |
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
          if ! curl -s --head --fail http://apt.llvm.org/focal/dists/llvm-toolchain-focal-14/ > /dev/null; then
            echo "O repositório LLVM não está acessível. Verifique a URL ou a versão." >&2
            exit 1
          fi
      - name: Add repository with retry
        run: |
          for i in {1..3}; do
            if sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test; then
              echo "Repositório adicionado com sucesso."
              break
            fi
            echo "Tentativa $i falhou. Retentando em 5 segundos..."
            sleep 5
          done
      - name: Enable detailed logs
        run: set -x
      - name: Ubuntu setup
        run: sudo -E .github/workflows/cibuild-setup-ubuntu.sh
      - name: Configure
        run: .github/workflows/cibuild.sh CONFIGURE
      - name: Make distcheck
        run: .github/workflows/cibuild.sh DISTCHECK
  build-s390x:
    runs-on: ubuntu-latest
    steps:
      - name: Repository checkout
        uses: actions/checkout@v1
      - uses: uraimo/run-on-arch-action@v2
        with:
          arch: s390x
          distro: ubuntu_latest
          run: |
            export COMPILER=gcc
            export COMPILER_VERSION=10
            export SANITIZE=no
            export QEMU_USER=1
            export CFLAGS="-Wno-error -Wno-unused-variable -Wno-unused-function"

            # name: Install dependencies
            apt-get update
            apt-get install -y build-essential gcc make
            # name: Add LLVM repository
            wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | apt-key add -
            apt-add-repository "deb http://apt.llvm.org/focal/ llvm-toolchain-focal-14 main"
            # name: Validate LLVM repository
            if ! curl -s --head --fail http://apt.llvm.org/focal/dists/llvm-toolchain-focal-14/ > /dev/null; then
              echo "O repositório LLVM não está acessível. Verifique a URL ou a versão." >&2
              exit 1
            fi
            # name: Add repository with retry
            for i in {1..3}; do
              if apt-add-repository -y ppa:ubuntu-toolchain-r/test; then
                echo "Repositório adicionado com sucesso."
                break
              fi
              echo "Tentativa $i falhou. Retentando em 5 segundos..."
              sleep 5
            done
            # name: Enable detailed logs
            set -x
            # name: Ubuntu setup
            .github/workflows/cibuild-setup-ubuntu.sh
            git config --global --add safe.directory "$PWD"
            # Build and validate binaries
            if [ -x "$(command -v sudo)" ]; then
              sudo ./configure
            else
              ./configure
            fi
            make -j$(nproc)
            if [ ! -f ./tests/run.sh ] || [ ! -f ./kill ]; then
              echo "Erro: Um ou mais binários não foram gerados."
              exit 1
            fi
            # Check
            .github/workflows/cibuild.sh CHECK
